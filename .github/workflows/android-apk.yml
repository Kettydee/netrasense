name: Build Android APK

on:
  push:
    branches:
      - codex/android-apk
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon --project-dir android assembleDebug
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetraSense-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: netrasense-android-v1.0.0
          name: NetraSense Android v1.0.0
          body: |
            Installable Android package for the NetraSense mobile app.
            The app opens the existing NetraSense website and needs an internet connection.
            This is a debug-signed APK for direct installation.
          draft: false
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
